<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f9ff"><title>Clarity Ledger · 모임 정산</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--canvas:#f8faff;--white:#fff;--ink:#0b1c30;--muted:#64748b;--line:#e2e8f0;--blue:#1e3a8a;--bright:#2563eb;--blue-soft:#eff4ff;--amber:#f59e0b;--amber-bg:#fef3c7;--red:#ba1a1a;--shadow:0 1px 3px rgba(30,58,138,.04),0 1px 2px rgba(0,0,0,.02);--r:16px}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:'Noto Sans KR','Public Sans',sans-serif;font-size:14px;line-height:1.5}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{width:min(100%,480px);min-height:100vh;margin:0 auto;background:var(--canvas);padding:0 16px 112px}.top{height:64px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px;font:800 16px Manrope,sans-serif;letter-spacing:-.04em}.logo{width:32px;height:32px;border-radius:10px;background:var(--blue);color:white;display:grid;place-items:center;font:700 17px Manrope}.save{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 11px;color:var(--muted);font-size:12px}.intro{padding:14px 0 19px}.eyebrow{color:var(--bright);font-size:11px;font-weight:700;letter-spacing:.1em}.intro h1{font:700 26px/1.3 Manrope,'Noto Sans KR',sans-serif;letter-spacing:-.04em;margin:6px 0}.intro p{color:var(--muted);margin:0}.steps{display:flex;gap:7px;margin-bottom:20px}.step{height:4px;background:#dbe4f5;border-radius:4px;flex:1}.step.active{background:var(--bright)}.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.card h2{margin:0;font-size:16px;line-height:1.4;font-weight:700}.mini{color:var(--muted);font-size:12px}.field{margin:12px 0}.field label,.label{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px;margin-bottom:7px}.hint{font-size:11px;color:var(--muted);font-weight:400}.input,textarea,select{width:100%;height:48px;border:1px solid var(--line);border-radius:8px;background:white;padding:0 13px;color:var(--ink);outline:none}.input:focus,textarea:focus,select:focus{border:2px solid var(--bright);box-shadow:0 0 0 3px #2563eb18}.currency{position:relative}.currency .input{padding-right:42px;text-align:right;font:600 16px Manrope,'Noto Sans KR';font-variant-numeric:tabular-nums}.currency span{position:absolute;right:13px;top:12px;color:var(--muted)}textarea{height:88px;padding:12px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.people{display:flex;flex-wrap:wrap;gap:7px}.person{border:0;border-radius:99px;background:#f1f5f9;color:#64748b;height:34px;padding:0 12px;display:flex;align-items:center;gap:6px}.person input{accent-color:var(--blue);margin:0}.person.selected{background:#dce7ff;color:var(--blue);font-weight:600}.person.exception{background:var(--amber-bg);border:1px solid var(--amber);color:#92400e}.person.absent{opacity:.48;text-decoration:line-through}.exception-box{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:13px;margin-top:12px}.exception-box .label{color:#78350f}.round{border-top:1px solid #edf0f5;padding-top:14px;margin-top:14px}.round:first-of-type{border:0;padding-top:0;margin:0}.round-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.round-title strong{font-size:14px}.remove{border:0;background:none;color:#ba1a1a;font-size:12px}.segmented{display:grid;grid-template-columns:repeat(3,1fr);background:#f1f5f9;border-radius:9px;padding:3px;gap:3px}.segmented label{text-align:center;cursor:pointer}.segmented input{position:absolute;opacity:0}.segmented span{display:block;padding:8px 3px;border-radius:7px;font-size:12px;color:var(--muted)}.segmented input:checked+span{background:#fff;color:var(--blue);font-weight:700;box-shadow:0 2px 7px #0b1c3012}.outline-btn{width:100%;height:44px;background:#fff;border:1px dashed #9db1d3;color:var(--blue);border-radius:9px;font-weight:600}.toggle-row{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px}.switch{width:42px;height:24px;border-radius:20px;background:#cbd5e1;position:relative;border:0}.switch:after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}.switch.on{background:var(--bright)}.switch.on:after{left:21px}.results{display:none}.results.show{display:block}.totalbox{background:var(--blue);color:#fff;border-radius:14px;padding:17px;margin-bottom:12px}.totalbox .mini{color:#c6d5ff}.total{font:800 28px Manrope,'Noto Sans KR';font-variant-numeric:tabular-nums;margin-top:2px}.result-row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #edf0f5;padding:11px 0}.result-row:last-child{border:0}.result-name{display:flex;align-items:center;gap:8px}.badge{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--amber-bg);color:#92400e}.amount{font:700 16px Manrope,'Noto Sans KR';font-variant-numeric:tabular-nums}.sharetext{border:1px solid var(--line);border-radius:10px;background:#f8fafc;padding:13px;white-space:pre-wrap;font-size:12px;color:#334155;line-height:1.7}.sticky{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);box-shadow:0 -4px 16px #0f172a0f;z-index:4}.primary,.kakao{width:100%;height:50px;border:0;border-radius:8px;font-weight:700;font-size:15px}.primary{background:var(--blue);color:#fff}.primary:active{background:#172554}.kakao{background:#fee500;color:#191919}.ghost{display:block;margin:8px auto 0;border:0;background:none;color:var(--muted);font-size:12px}.toast{position:fixed;z-index:9;bottom:98px;left:50%;transform:translate(-50%,15px);opacity:0;transition:.2s;background:#17212c;color:white;padding:10px 16px;border-radius:8px;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.error{color:var(--red);font-size:12px;margin:8px 0 0;display:none}.error.show{display:block}.section-label{font-size:11px;color:#64748b;font-weight:700;letter-spacing:.04em;margin:17px 0 7px}@media(min-width:640px){body{padding:24px 0}.shell{border:1px solid #e8edf5;border-radius:22px;box-shadow:0 12px 40px #243b6410;min-height:calc(100vh - 48px)}.sticky{bottom:24px;border-radius:0 0 22px 22px}}
</style></head>
<body><main class="shell">
<header class="top"><div class="brand"><span class="logo">₩</span> clarity ledger</div><button class="save" type="button" onclick="toast('현재 입력은 이 기기에 임시 저장됩니다.')">임시 저장됨 ✓</button></header>
<section class="intro"><div class="eyebrow">SMART GROUP SETTLEMENT</div><h1>모임 정산, 깔끔하게</h1><p>예외까지 반영해 공정한 금액을 계산해요.</p></section>
<div class="steps"><span class="step active"></span><span class="step active"></span><span class="step" id="step3"></span></div>
<section class="card"><div class="card-head"><h2>모임과 참석자</h2><span class="mini">1 / 2</span></div><div class="field"><label for="meeting">모임 이름 <span class="hint">최대 20자</span></label><input class="input" id="meeting" maxlength="20" value="개강 총회" placeholder="예: 개강 총회"></div><div class="field"><label for="names">참석자 이름 <span class="hint">쉼표로 구분 · 최대 30명</span></label><textarea id="names" placeholder="민준, 서연, 지우">민준, 서연, 지우, 하늘, 도윤, 수빈</textarea><div class="hint" style="margin-top:5px">이름은 최대 10자까지 입력할 수 있어요.</div><div class="error" id="peopleError"></div></div><div class="section-label">정산 받을 계좌 (선택)</div><div class="two"><select id="bank"><option value="">은행 선택</option><option>카카오뱅크</option><option>국민은행</option><option>신한은행</option><option>우리은행</option><option>토스뱅크</option><option>하나은행</option><option>농협은행</option></select><input class="input" id="account" maxlength="20" inputmode="numeric" placeholder="계좌번호"></div><div class="field"><label for="owner">예금주</label><input class="input" id="owner" maxlength="10" placeholder="예: 김민준"></div></section>
<section class="card"><div class="card-head"><h2>차수별 지출과 예외</h2><span class="mini">지출 내역을 입력해 주세요</span></div><div id="rounds"></div><button class="outline-btn" id="addRound" type="button">＋ 차수 추가</button></section>
<section class="card"><div class="card-head"><h2>잔돈 정돈</h2><span class="mini">개인별 금액에 적용</span></div><div class="segmented"><label><input type="radio" name="rounding" value="1" checked><span>1원 단위</span></label><label><input type="radio" name="rounding" value="floor"><span>100원 절사</span></label><label><input type="radio" name="rounding" value="ceil"><span>100원 올림</span></label></div></section>
<section class="results" id="results"><div class="card"><div class="card-head"><h2>정산 결과</h2><span class="mini" id="resultCount"></span></div><div class="totalbox"><div class="mini">모임 총 지출</div><div class="total" id="totalSpend">₩0</div></div><div id="resultRows"></div></div><div class="card"><div class="card-head"><h2>단톡방 공유 내용</h2><span class="mini">복사 전에 확인해 주세요</span></div><div class="sharetext" id="shareText"></div></div></section>
<footer class="sticky" id="sticky"><button class="primary" id="calculate" type="button">정산 결과 확인</button></footer><div class="toast" id="toast"></div>
</main>
<template id="roundTemplate"><div class="round"><div class="round-title"><strong><span class="round-name">1차</span> 지출</strong><button class="remove" type="button">삭제</button></div><div class="field"><label>차수 총 지출</label><div class="currency"><input class="input spend" type="number" min="0" max="10000000" inputmode="numeric" placeholder="0"><span>원</span></div></div><div class="toggle-row"><div><strong style="font-size:13px">주류 비용 나누기</strong><div class="hint">술값을 따로 입력해 비음용자 부담을 제외해요</div></div><button class="switch" type="button" aria-label="주류 비용 나누기"></button></div><div class="alcohol-area" hidden><div class="field"><label>주류 금액</label><div class="currency"><input class="input alcohol" type="number" min="0" inputmode="numeric" placeholder="0"><span>원</span></div></div><div class="exception-box"><div class="label">🍺 술을 마시지 않은 멤버 <span class="hint">선택하면 주류비 제외</span></div><div class="people nondrinkers"></div></div></div><div class="field"><div class="label">이 차수 참석자 <span class="hint">기본: 전원 참석</span></div><div class="people attendance"></div></div><div class="error round-error"></div></div></template>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];let roundCount=0;const fmt=n=>'₩'+Math.round(n).toLocaleString('ko-KR');
function names(){return $('#names').value.split(/[，,\n]/).map(x=>x.trim()).filter(Boolean)}
function refreshPeople(){const ns=names();$$('.round').forEach(r=>{const oldA=new Set($$('.attendance .person',r).filter(x=>x.querySelector('input').checked).map(x=>x.dataset.name)),oldN=new Set($$('.nondrinkers .person',r).filter(x=>x.querySelector('input').checked).map(x=>x.dataset.name));r.querySelector('.attendance').innerHTML='';r.querySelector('.nondrinkers').innerHTML='';ns.forEach((n,i)=>{for(const [box,set,kind] of [[r.querySelector('.attendance'),oldA,'att'],[r.querySelector('.nondrinkers'),oldN,'nd']]){const lab=document.createElement('label');lab.className='person';lab.dataset.name=n;lab.innerHTML=`<input type="checkbox" ${kind==='att'&&!oldA.size?'checked':set.has(n)?'checked':''}><span>${n}</span>`;box.append(lab);lab.querySelector('input').addEventListener('change',()=>{lab.classList.toggle(kind==='nd'?'exception':'selected',lab.querySelector('input').checked);if(kind==='att')lab.classList.toggle('absent',!lab.querySelector('input').checked);});if(kind==='att')lab.classList.toggle('selected',lab.querySelector('input').checked);}});});}
function addRound(){roundCount++;const el=$('#roundTemplate').content.firstElementChild.cloneNode(true);el.querySelector('.round-name').textContent=roundCount+'차';el.dataset.index=roundCount;$('#rounds').append(el);const sw=el.querySelector('.switch');sw.addEventListener('click',()=>{sw.classList.toggle('on');el.querySelector('.alcohol-area').hidden=!sw.classList.contains('on')});el.querySelector('.remove').addEventListener('click',()=>{if($$('.round').length===1){toast('최소 한 차수는 필요해요.');return}el.remove();renumber()});el.querySelectorAll('input').forEach(x=>x.addEventListener('input',clearResults));refreshPeople()}
function renumber(){$$('.round').forEach((r,i)=>r.querySelector('.round-name').textContent=(i+1)+'차')}
function clearResults(){ $('#results').classList.remove('show');$('#step3').classList.remove('active') }
function calculate(){const ns=names(),err=$('#peopleError');err.classList.remove('show');if(ns.length<2){err.textContent='참석자는 최소 2명 이상 입력해야 합니다.';err.classList.add('show');return}if(ns.length>30||ns.some(n=>n.length>10)){err.textContent='참석자는 최대 30명, 이름은 10자까지 입력할 수 있어요.';err.classList.add('show');return}if(new Set(ns).size!==ns.length){err.textContent='중복된 이름이 있습니다. (예: 민준1, 민준2로 구분)';err.classList.add('show');return}let sums=Object.fromEntries(ns.map(n=>[n,0])),total=0,valid=true;$$('.round').forEach((r,i)=>{const e=r.querySelector('.round-error');e.classList.remove('show');const spend=Number(r.querySelector('.spend').value||0),hasAlc=r.querySelector('.switch').classList.contains('on'),alc=hasAlc?Number(r.querySelector('.alcohol').value||0):0,att=$$('.attendance .person',r).filter(x=>x.querySelector('input').checked).map(x=>x.dataset.name),nd=$$('.nondrinkers .person',r).filter(x=>x.querySelector('input').checked).map(x=>x.dataset.name),drinkers=att.filter(n=>!nd.includes(n));if(spend<0||spend>10000000){e.textContent='지출 금액은 0원 이상이어야 합니다.';valid=false}else if(alc>spend){e.textContent='주류 금액이 차수 총 지출액보다 클 수 없습니다.';valid=false}else if(hasAlc&&alc>0&&drinkers.length===0){e.textContent='술을 마신 사람이 최소 1명 이상이어야 합니다.';valid=false}else if(att.length===0){e.textContent='차수 참석자를 한 명 이상 선택해 주세요.';valid=false}else{const base=(spend-alc)/att.length,drink=drinkers.length?alc/drinkers.length:0;att.forEach(n=>sums[n]+=base+(nd.includes(n)?0:drink));total+=spend}});if(!valid){$$('.round-error').forEach(e=>{if(e.textContent)e.classList.add('show')});return}const round=$('input[name="rounding"]:checked').value;const adjusted=Object.fromEntries(ns.map(n=>[n,round==='floor'?Math.floor(sums[n]/100)*100:round==='ceil'?Math.ceil(sums[n]/100)*100:Math.round(sums[n])]));$('#totalSpend').textContent=fmt(total);$('#resultCount').textContent=ns.length+'명';$('#resultRows').innerHTML=ns.map(n=>{const exceptions=$$('.round',document).some(r=>$$('.nondrinkers .person',r).some(x=>x.dataset.name===n&&x.querySelector('input').checked));return `<div class="result-row"><div class="result-name">${n}${exceptions?'<span class="badge">주류 제외</span>':''}</div><div class="amount">${fmt(adjusted[n])}</div></div>`}).join('');const meeting=$('#meeting').value||'모임',bank=$('#bank').value,acct=$('#account').value,owner=$('#owner').value;let txt=`[${meeting} 정산 안내]\n총 금액: ${fmt(total).replace('₩','')}\n\n${ns.map(n=>`${n}: ${fmt(adjusted[n]).replace('₩','')}`).join('\n')}\n\n`;if(bank&&acct)txt+=`입금 계좌: ${bank} ${acct}${owner?' ('+owner+')':''}`;$('#shareText').textContent=txt;$('#results').classList.add('show');$('#step3').classList.add('active');$('#sticky').innerHTML='<button class="kakao" id="copy" type="button">카카오톡 정산 텍스트 복사</button><button class="ghost" id="edit" type="button">내역 수정</button>';$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(txt);toast('정산 내역이 복사되었습니다.')}catch(e){toast('클립보드 복사에 실패했습니다. 아래 텍스트를 직접 복사해 주세요.')}};$('#edit').onclick=()=>{clearResults();$('#sticky').innerHTML='<button class="primary" id="calculate" type="button">정산 결과 확인</button>';$('#calculate').onclick=calculate;window.scrollTo({top:0,behavior:'smooth'})};document.querySelector('#results').scrollIntoView({behavior:'smooth',block:'start'})}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
$('#addRound').onclick=addRound;$('#names').addEventListener('input',()=>{refreshPeople();clearResults()});$('#calculate').onclick=calculate;$$('input[name="rounding"]').forEach(x=>x.addEventListener('change',clearResults));addRound();
</script></body></html>
